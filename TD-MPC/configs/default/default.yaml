name: TD-MPC (default)

# Task parameters
max_episode_length: 600
image_observations: False

# Training parameters
training_rounds: 400
training_steps_per_round: 100   # only used when updates_per_env_step is null
num_episodes_per_round: 3
eval_policy_every: 5
seed_episodes: 50               # uniform random-action episodes to seed the buffer
updates_per_env_step: 1.0       # gradient steps per env step collected (UTD ratio); null -> use training_steps_per_round

# More specific training parameters
noisy_action_training: True
noisy_action_experience: True

# Replay buffer / prioritized experience replay
replay_capacity: 1000000
prioritized_replay: False
per_alpha: 0.6          # prioritization exponent (0 = uniform sampling)
per_beta_start: 0.4     # importance-sampling correction, annealed to 1.0
per_beta_frames: 200000 # env steps over which beta reaches 1.0

# General Neural Network Training Hyperparameters
frame_stack: 3
aug_pad: 4          # DrQ random-shift padding in pixels; 0 disables augmentation
learning_rate: 3e-4
learning_rate_actor: 1e-4
batch_size: 512
latent_dim: 50
hidden_dim: 256
gamma: 0.97               # shorter effective horizon -> value target propagates from zero much faster
time_lambda: 0.5
reward_loss_weight: 0.5
value_loss_weight: 0.5
consistency_loss_weight: 2.0
terminal_loss_weight: 9.0  # extra weight on horizon steps that end in termination

# Sampling planner
sampler: MPPI
horizon: 5
sampling_noise: 0.3
optimization_iterations: 10
sample_size: 256

predictive-sampling:
  # The number of candidate action sequences to sample at each time step
  num_candidates: 256
  # The standard deviation of the Gaussian noise added to the action sequences during sampling
  noise_std: 0.3

MPPI:
  # The number of candidate action sequences to sample at each time step
  num_candidates: 256
  # The standard deviation of the Gaussian noise added to the action sequences during sampling
  noise_std: 0.2
  # Temperature coefficient for softmax weighting
  temperature: 1.0
  # Number of optimization iterations
  num_opt_iterations: 5

CEM:
  # The number of candidate action sequences to sample at each time step
  num_candidates: 256
  # The number of elite candidates to select for updating the distribution
  num_elites: 64
  # The standard deviation of the Gaussian noise added to the action sequences during sampling
  noise_std: 0.1


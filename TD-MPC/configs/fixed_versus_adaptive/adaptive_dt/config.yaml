name: TD-MPC (default)
device: cuda

# Task parameters
task: walker-walk        # dm_control domain-task (e.g. cheetah-run, cartpole-swingup, quadruped-run)
action_repeat: 2         # env steps executed per agent action
image_observations: False

# Training parameters
seed_steps: 5000    #was 5000
eval_policy_every: 5
eval_episodes: 10
train_steps: 40000

# Replay buffer / prioritized experience replay
replay_capacity: 1000000
prioritized_replay: False
per_alpha: 0.6          # prioritization exponent (0 = uniform sampling)
per_beta: 0.4
per_beta_frames: 200000 # env steps over which beta reaches 1.0

min_std: 0.05
std_schedule: linear(0.5, 0.05, 25000)   # final == min_std

# General Neural Network Training Hyperparameters
frame_stack: 3
aug_pad: 4          # DrQ random-shift padding in pixels; 0 disables augmentation
learning_rate: 3e-4
learning_rate_actor: 1e-4
batch_size: 512
latent_dim: 50
# hidden_dim: 256
gamma: 0.99               # shorter effective horizon -> value target propagates from zero much faster
time_lambda: 0.5
reward_loss_weight: 0.5
value_loss_weight: 0.5
consistency_loss_weight: 2.0

# Delta t conditioning (variable macro-step size)
condition_dt: true        # true -> dynamics + reward heads take a Delta t (seconds) scalar
dt_scale: 1.0             # conditioning feature = dt * dt_scale (set ~1/dt_base to normalise)
dt_base: null             # seconds per base env step; set at runtime by env.py
k_max: 4                  # max macro-step stride (in base env steps) sampled during training
plan_k: 1                 # fixed macro-step stride used by the planner

# Sampling planner
sampler: MPPI
horizon: 5
sampling_noise: 0.3
optimization_iterations: 10
sample_size: 256

predictive-sampling:
  # The number of candidate action sequences to sample at each time step
  num_candidates: 256
  # The standard deviation of the Gaussian noise added to the action sequences during sampling
  noise_std: 0.3

MPPI:
  # The number of candidate action sequences to sample at each time step
  num_candidates: 256
  # The standard deviation of the Gaussian noise added to the action sequences during sampling
  noise_std: 0.2
  # Temperature coefficient for softmax weighting
  temperature: 1.0
  # Number of optimization iterations
  num_opt_iterations: 5
  # Fraction of candidate trajectories seeded from the learned policy
  mixture_coef: 0.05

CEM:
  # The number of candidate action sequences to sample at each time step
  num_candidates: 256
  # The number of elite candidates to select for updating the distribution
  num_elites: 64
  # Floor on the per-step sampling std of the action distribution
  noise_std: 0.1
  # Ceiling / initial value of the per-step sampling std
  max_noise_std: 2.0
  # Number of CEM optimization iterations per plan() call
  num_opt_iterations: 6
  # Softmax temperature for elite weighting
  temperature: 0.5
  # Momentum on the distribution mean across CEM iterations
  momentum: 0.1
  # Fraction of candidate trajectories seeded from the learned policy
  mixture_coef: 0.05

# ---------------------------------------------------------------------------
# Entries consumed by tdmpc.py (the original TDMPC / TOLD implementation).
# Defaults taken from nicklashansen/tdmpc's config/default.yaml.
# NOTE: several of these duplicate keys above under different names
# (discount==gamma, lr==learning_rate, rho==time_lambda,
#  reward/value/consistency_loss_weight already exist). Kept separate so
# tdmpc.py runs unmodified; reconcile later if you standardise on one config.
# ---------------------------------------------------------------------------

# TOLD network architecture
enc_dim: 256              # hidden width of the state (non-pixel) encoder MLP
mlp_dim: 512              # hidden width of dynamics / reward / policy / Q MLPs
num_channels: 32          # conv channels in the pixel encoder
img_size: 64              # pixel-encoder input resolution (this project resizes frames to 64x64)
obs_shape: null           # set at runtime by train.py from env.observation_space (e.g. [state_dim])

# Optimisation
lr: 3e-4                  # Adam learning rate for TOLD + policy
discount: 0.99            # reward discount factor (gamma)
rho: 0.5                  # temporal loss decay across the horizon
grad_clip_norm: 10        # global grad-norm clip
tau: 0.01                 # target-network EMA coefficient
update_freq: 2            # env steps between target-network EMA updates

# CEM / MPPI planner (tdmpc.plan)
iterations: 6             # CEM optimisation iterations
num_samples: 512          # sampled action trajectories per iteration
num_elites: 64            # elite trajectories kept per iteration
mixture_coef: 0.05        # fraction of trajectories seeded from the policy
temperature: 0.5          # softmax temperature for elite weighting
momentum: 0.1             # mean update momentum across iterations

seed: 1
modality: state